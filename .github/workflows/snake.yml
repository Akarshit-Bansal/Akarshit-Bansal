name: Generate contribution snake

on:
  schedule:
    - cron: "42 1 * * *"      # daily, offset from the art job
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Build snake SVGs from the live contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=39ff14&color_dots=10251c,0e6b3f,12b866,22e07a,39ff14
            dist/github-contribution-grid-snake.svg?color_snake=39ff14&color_dots=#10251c,#0e6b3f,#12b866,#22e07a,#39ff14

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
