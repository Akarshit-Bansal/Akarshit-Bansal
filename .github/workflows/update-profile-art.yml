name: Update profile art

on:
  schedule:
    - cron: "17 2 * * *"      # daily at 02:17 UTC
  workflow_dispatch:           # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"
      - "assets/me.jpg"
      - "assets/me.png"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_USER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render portrait (photo if present, else avatar)
        run: python scripts/gen_portrait.py

      - name: Render info card
        run: python scripts/gen_info_card.py

      - name: Render contribution heatmap
        run: python scripts/gen_heatmap.py

      - name: Render tech-stack board
        run: python scripts/gen_tech_stack.py

      - name: Render wave divider
        run: python scripts/gen_waves.py

      - name: Render impact + streak cards
        run: python scripts/gen_stats.py

      - name: Render snake teaser
        run: python scripts/gen_snake.py

      - name: Commit updated art
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile art [skip ci]"
            git push
          fi
